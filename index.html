function top(){let nav=['Home','Campaigns','Content','Creator House','Talent','Partners','Assets','Insights'];return `<div class="top"><div class="brand">OTT</div><div class="nav">${nav.map(n=>`<button class="${page===n?'on':''}" data-nav="${n}">${n}</button>`).join('')}</div><div class="right"><span class="chip">${mode==='cloud'?'● Team synced':'○ Local preview'}</span><button class="btn" data-action="settings">⚙</button><button class="btn primary" data-action="create">+ Create</button></div></div>`}

function listRow(name,meta,right,target,img=''){return `<div class="listrow" data-open="${target}"><div class="thumb" style="background-image:${photo(img)}"></div><div style="min-width:0"><b>${esc(name)}</b><div class="sub">${meta}</div></div><span class="mini muted">${esc(right)}</span></div>`}

function campaign(c){let tabs=['Overview','Content','Social','Creators','Talent','Partners','Tickets','Assets','Tasks','Performance'];let tab=filter&&tabs.includes(filter)?filter:'Overview';let relatedContent=state.content.filter(x=>x.campaign_id===c.id),relatedTasks=state.tasks.filter(x=>x.campaign_id===c.id),relatedBookings=state.bookings.filter(x=>x.campaign_id===c.id),relatedAssets=state.assets.filter(x=>x.campaign_id===c.id),relatedPartners=state.partners.filter(x=>x.campaign_id===c.id),relatedTickets=state.tickets.filter(x=>x.campaign_id===c.id);let head=`<div class="row"><button class="btn" data-nav="Campaigns">← Campaigns</button><button class="btn" data-open="editcampaign:${c.id}">Edit campaign</button></div><div style="margin:16px 0">${event(c,true)}</div><div class="tabs">${tabs.map(x=>`<button class="${x===tab?'on':''}" data-tab="${x}">${x}</button>`).join('')}</div>`;let content=tab==='Overview'?`<div class="grid g2"><div class="panel"><div class="row"><h3>Upcoming content</h3><button class="btn" data-action="add:content">+ Post</button></div>${relatedContent.length?relatedContent.map(x=>listRow(x.title,esc(x.platform)+' · '+esc(x.status),fmt(x.date),`content:${x.id}`,x.photo)).join(''):'<div class="empty">No posts attached yet.</div>'}</div><div class="panel"><div class="row"><h3>To do</h3><button class="btn" data-action="add:task">+ Task</button></div>${relatedTasks.length?relatedTasks.map(x=>listRow(x.title,esc(x.owner||'Unassigned'),esc(x.status),`task:${x.id}`)).join(''):'<div class="empty">No tasks attached yet.</div>'}</div><div class="panel"><h3>Talent & creators</h3>${relatedBookings.length?relatedBookings.map(x=>listRow(personName(x.person_id),esc(x.status),fmt(x.date),`person:${x.person_id}`)).join(''):'<div class="empty">No bookings yet. <button class="btn" data-action="add:booking">+ Assign</button></div>'}</div><div class="panel"><h3>Source status</h3><div class="integration"><b>Social</b><span class="chip">Not connected</span></div><div c "btn" data-action="add:asset">+ Asset</button></div><div class="grid g3">${relatedAssets.map(assetCard).join('')||'<div class="empty">Add approved artwork or photo URLs.</div>'}</div>`:tab==='Tasks'?`<div class="panel"><div class="row"><h3>Campaign tasks</h3><button class="btn" data-action="add:task">+ Task</button></div>${relatedTasks.map(x=>listRow(x.title,esc(x.owner||'Unassigned'),esc(x.status),`task:${x.id}`)).join('')||'<div class="empty">No tasks yet.</div>'}</div>`:`<div class="panel"><h3>Verified performance only</h3><p class="sub">Connect a platform or add a sourced SweatPals report to populate performance. No fabricated impressions, ticket counts or revenue.</p><button class="btn" data-nav="Insights">View integrations ↗</button></div>`;return head+content}
function contentPage(){let posts=state.content.filter(x=>!filter||x.campaign_id===filter);let controls=`<div class="row"><div class="filters"><button class="btn ${view==='Calendar'?'black':''}" data-view="Calendar">Calendar</button><button class="btn ${view==='Queue'?'black':''}" data-view="Queue">Queue</button><select class="field" style="width:220px" data-filter><option value="">All campaigns</option>${state.campaigns.map(x=>`<option value="${x.id}" ${filter===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><button class="btn primary" data-action="add:content">+ Create content</button></div>`;if(view==='Queue')return title('Content','Plan, approve, publish and track.')+controls+`<div class="panel" style="margin-top:16px">${posts.length?posts.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(x=>listRow(x.title,`${esc(campaignName(x.campaign_id))} · ${esc(x.platform)} · ${esc(x.status)}`,fmt(x.date),`content:${x.id}`,x.photo)).join(''):'<div class="empty">Your content queue is empty.</div>'}</div>`;let [y,m]=month.split('-').map(Number),start=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<start;i++)cells.push('<div></div>');for(let i=1;i<=days;i++){let d=`${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`,items=posts.filter(x=>x.date===d);cells.push(`<div class="day" data-date="${d}" ondragover="event.preventDefault()"><span class="num">${i}</span>${items.map(x=>`<span class="post" draggable="true" data-drag="${x.id}" data-status="${esc(x.status)}" data-open="content:${x.id}">${esc(x.title)}</span>`).join('')}</div>`)}return title('Content','The calendar is the plan. The creative is the work.')+controls+`<div class="row" style="margin:20px 0"><button class="btn" data-month="-1">←</button><h2>${new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><button class="btn" data-month="1">→</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="eyebrow" style="text-align:center;padding:6px">${x}</div>`).join('')}${cells.join('')}</div>`}
function peoplePage(role){let people=state.people.filter(x=>x.role===role);return title(role==='Creator'?'Creator House':'Talent',role==='Creator'?'People, relationships and activations.':'Bookings, promotion and performance.',`<button class="btn primary" data-action="add:person:${role}">+ ${role}</button>`)+`<div class="grid g3" style="margin-top:22px">${people.map(p=>`<div class="panel person" data-open="person:${p.id}"><div class="visual tall" style="background-image:${photo(p.photo)}">${p.photo?'':`<div class="initial">${esc(p.name.slice(0,1))}</div>`}</div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.handle||p.market||'Profile')}</div><div class="chips"><span class="chip">${esc(p.status||'New')}</span><span class="chip">${esc(p.genre||p.niche||role)}</span><span class="chip">${state.bookings.filter(b=>b.person_id===p.id).length} OTT assignments</span></div></div>`).join('')||'<div class="empty">Add your first profile.</div>'}</div>`}
function person(p){let bookings=state.bookings.filter(b=>b.person_id===p.id);return `<div class="row"><button class="btn" data-nav="${p.role==='Talent'?'Talent':'Creator House'}">← Back</button><button class="btn" data-open="editperson:${p.id}">Edit profile</button></div><div class="grid g2" style="margin-top:16px"><div class="visual tall" style="background-image:${photo(p.photo)}">${p.photo?'':`<div class="initial">${esc(p.name[0])}</div>`}</div><div class="panel"><div class="eyebrow">${esc(p.role)} / ${esc(p.market)}</div><h1>${esc(p.name)}</h1><div class="chips"><span class="chip">${esc(p.status)}</span><span class="chip">${esc(p.genre||p.niche||'Uncategorised')}</span></div><div class="section"><h3>Relationship</h3><p>${esc(p.notes||'No relationship notes yet.')}</p><div class="sub">${esc(p.handle||'No social handle')} · ${esc(p.manager||'No manager listed')}</div></div><div class="section"><div class="row"><h3>OTT work</h3><button class="btn" data-action="add:booking">+ Assign</button></div>${bookings.length?bookings.map(x=>listRow(campaignName(x.campaign_id),esc(x.status)+' · '+esc(x.set_time||''),fmt(x.date),`booking:${x.id}`)).join(''):'<div class="empty">No OTT assignments yet.</div>'}</div></div></div>`}
function partners(){return title('Partners','Commitments and deliverables.',`<button class="btn primary" data-action="add:partner">+ Partner</button>`)+`<div class="panel" style="margin-top:18px">${state.partners.map(x=>listRow(x.name,`${esc(campaignName(x.campaign_id))} · ${esc(x.deliverable||'')}`,esc(x.status),`partner:${x.id}`)).join('')||'<div class="empty">No partners added yet.</div>'}</div>`}
function assetCard(a){return `<div class="panel asset-card" data-open="asset:${a.id}"><div class="visual" style="background-image:${photo(a.url)}"></div><h3>${esc(a.name)}</h3><div class="sub">${esc(campaignName(a.campaign_id))} · ${esc(a.source||'Manual')}</div></div>`}
function assets(){return title('Assets','Approved photography, artwork and media.',`<button class="btn primary" data-action="add:asset">+ Asset</button>`)+`<div class="grid g3" style="margin-top:18px">${state.assets.map(assetCard).join('')||'<div class="empty">No assets imported. Add approved image URLs or upload to your connected storage.</div>'}</div><div class="panel section"><h3>Verified Dropbox source collections</h3><p class="sub">The Blend LA (October 2026) · Isaiah Everett Photography / Highlights<br>The Affair Gala 2022 / PHOTO<br>Fit Fest 2026 Marketing Assets / DJ Jaymee photo</p><p class="photo-note">Source files have been located in Dropbox; they are not yet imported into durable application storage.</p></div>`}
function insights(){return title('Insights','Real sources. No invented performance.')+`<div class="grid g2" style="margin-top:18px"><div class="panel"><h3>Connections</h3>${[['Instagram','@overthetopxp'],['TikTok','@overthetopxp'],['YouTube','OTT channel'],['SweatPals','Ticketing'],['Dropbox','OTT assets']].map(([a,b])=>`<div class="integration"><div><b>${a}</b><div class="sub">${b}</div></div><span class="chip">${a==='Dropbox'?'Archive identified':'Authorisation pending'}</span></div>`).join('')}</div><div class="panel"><h3>What reports can show</h3><p class="sub">Once authorised, verified platform data can connect published content to campaigns, talent and creators. Ticket reports can be imported with their source and reporting date.</p><div class="row"><button class="btn" data-action="add:ticket">+ Ticket report</button><button class="btn primary" data-action="importcsv">Import SweatPals CSV</button><button class="btn" data-action="settings">Team setup</button></div></div></div>`}
function settings(){return `<div class="panel" style="max-width:720px"><h2>Team setup</h2><p class="sub">OTT Studio is connected to the OTT Supabase project. Team-wide sync activates after the included database setup is applied.</p><div class="integration"><div><b>Database</b><div class="sub">mqybmdqcixfhtbddmaof.supabase.co</div></div><span class="chip">${cloudReady?'Connected':'Setup pending'}</span></div><div class="row" style="margin-top:16px"><span class="chip">Login temporarily disabled</span></div><p class="sub">No secret or service-role credentials are stored in this app.</p></div>`}
function render(){if(!AUTH_DISABLED && client && (!user||!cloudReady)){ $('root').innerHTML=top()+`<main class="wrap"><div class="panel login"><div class="eyebrow">OTT / STUDIO</div><h1>Team access.</h1><p class="sub">${user?'Your account needs OTT workspace access or the database setup is incomplete.':'Sign in with an approved OTT team email to access shared records.'}</p><button class="btn primary" data-action="signin">${user?'Account / Sign out':'Sign in'}</button></div></main>`;return}let body=selected?.type==='campaign'?campaign(state.campaigns.find(x=>x.id===selected.id)):selected?.type==='person'?person(state.people.find(x=>x.id===selected.id)):page==='Home'?home():page==='Campaigns'?campaigns():page==='Content'?contentPage():page==='Creator House'?peoplePage('Creator'):page==='Talent'?peoplePage('Talent'):page==='Partners'?partners():page==='Assets'?assets():page==='Insights'?insights():settings();$('root').innerHTML=top()+`<main class="wrap">${body}</main>`}
const specs={campaign:{title:'Campaign',collection:'campaigns',fields:[['name','Campaign name','text'],['date','Event date','date'],['market','Market','text'],['status','Status','select','Planning|On sale|Active|Completed'],['photo','Approved cover image URL','url'],['archive','Archive / source notes','text']]},person:{title:'Person',collection:'people',fields:[['name','Name','text'],['role','Role','select','Creator|Talent'],['handle','Social handle / URL','text'],['market','Market','text'],['genre','Genre / niche','text'],['status','Relationship status','select','New|Vetting|Invited|Active|On hold|Inactive'],['photo','Approved profile image URL','url'],['manager','Manager / contact','text'],['fee','Rate / fee','text'],['notes','Relationship notes','textarea']]},content:{title:'Content',collection:'content',fields:[['title','Content title','text'],['campaign_id','Campaign','campaign'],['platform','Platform','select','Instagram Reel|Instagram Feed|Instagram Story|TikTok|YouTube|Email|SMS'],['date','Publish date','date'],['time','Publish time','time'],['status','Status','select','Idea|Draft|Needs approval|Approved|Scheduled|Published'],['owner','Owner','text'],['photo','Creative preview URL','url'],['caption','Caption / creative notes','textarea'],['published_url','Published post URL','url']]},task:{title:'Task',collection:'tasks',fields:[['title','Task','text'],['campaign_id','Campaign','campaign'],['owner','Owner','text'],['due','Due date','date'],['status','Status','select','Open|In progress|Blocked|Done']]},booking:{title:'Booking / assignment',collection:'bookings',fields:[['person_id','Person','person'],['campaign_id','Campaign','campaign'],['date','Booking date','date'],['set_time','Set time / deliverable','text'],['fee','Fee / compensation','text'],['status','Stage','select','Inquiry|Hold|Confirmed|Contract|Promo|Performed|Paid'],['notes','Notes','textarea']]},partner:{title:'Partner',collection:'partners',fields:[['name','Partner name','text'],['campaign_id','Campaign','campaign'],['deliverable','Deliverables','textarea'],['status','Status','select','Prospect|Negotiating|Confirmed|In progress|Delivered'],['notes','Notes','textarea']]},asset:{title:'Asset',collection:'assets',fields:[['name','Asset name','text'],['campaign_id','Campaign','campaign'],['url','Approved image / file URL','url'],['source','Source / photographer','text'],['notes','Usage rights / notes','textarea']]},ticket:{title:'Ticket report',collection:'tickets',fields:[['label','Report label','text'],['campaign_id','Campaign','campaign'],['sold','Tickets sold','number'],['revenue','Revenue','number'],['source','Source (e.g. SweatPals export)','text'],['report_date','Report date','date']]}};
function formField([key,label,type,options],obj){let v=obj[key]??'',base=`name="${key}" class="field"`;if(type==='campaign')return `<label>${label}<select ${base}><option value="">Select campaign</option>${state.campaigns.map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;if(type==='person')return `<label>${label}<select ${base}><option value="">Select person</option>${state.people.map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select></label>`;if(type==='select')return `<label>${label}<select ${base}>${options.split('|').map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></label>`;if(type==='textarea')return `<label>${label}<textarea ${base}>${esc(v)}</textarea></label>`;return `<label>${label}<input ${base} type="${type}" value="${esc(v)}"></label>`}
function modal(type,existing=null,preset={}){let s=specs[type];if(!s)return;let obj={...preset,...(existing||{})};let el=document.createElement('div');el.className='modalbg';el.innerHTML=`<div class="modal"><header><h2>${existing?'Edit':'Add'} ${s.title}</h2><button class="close" data-close>×</button></header><form id="recordform" class="form">${s.fields.map(f=>formField(f,obj)).join('')}<div class="row"><button class="btn primary" type="submit">${existing?'Save changes':'Create'}</button>${existing?'<button type="button" class="btn" data-delete>Delete</button>':''}</div></form></div>`;document.body.append(el);el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]'))el.remove();if(e.target.closest('[data-delete]')){if(confirm('Delete this record?')){state[s.collection]=state[s.collection].filter(x=>x.id!==existing.id);el.remove();selected=null;save('Deleted '+s.title,existing.name||existing.title)}}});el.querySelector('form').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),r={...obj,id:existing?.id||id()};for(let [k,v]of fd)r[k]=v;let idx=state[s.collection].findIndex(x=>x.id===r.id);if(idx>=0)state[s.collection][idx]=r;else state[s.collection].push(r);el.remove();save((existing?'Updated ':'Added ')+s.title,r.name||r.title||campaignName(r.campaign_id))}}
function signin(){if(!client){notify('Configure Supabase first');return}let el=document.createElement('div');el.className='modalbg';el.innerHTML=`<div class="modal login"><header><h2>OTT team access</h2><button class="close">×</button></header>${user?`<p>Signed in as ${esc(user.email)}</p><button class="btn black" id="logout">Sign out</button>`:`<p class="sub">Sign in with an authorised OTT team email. This sends a magic link.</p><form id="authform" class="form"><label>Work email<input type="email" name="email" required class="field"></label><button class="btn primary">Send sign-in link</button></form>`}</div>`;document.body.append(el);el.querySelector('.close').onclick=()=>el.remove();if(user)el.querySelector('#logout').onclick=async()=>{await client.auth.signOut();user=null;mode='local';el.remove();render()};else el.querySelector('form').onsubmit=async e=>{e.preventDefault();let email=new FormData(e.target).get('email');let {error}=await client.auth.signInWithOtp({email,emailRedirectTo:location.origin+location.pathname});notify(error?error.message:'Check your email for the sign-in link');if(!error)el.remove()}}
function action(name){if(!AUTH_DISABLED && client && (!user||!cloudReady) && !['signin','settings','saveconfig'].includes(name)){notify('Sign in to your OTT team account first');return}if(name==='settings'){selected=null;page='Settings';render()}else if(name==='signin')signin();else if(name==='importcsv')importTickets();else if(name==='create'){modal(page==='Content'?'content':page==='Creator House'||page==='Talent'?'person':page==='Partners'?'partner':page==='Assets'?'asset':'task',null,page==='Creator House'?{role:'Creator'}:page==='Talent'?{role:'Talent'}:{campaign_id:selected?.type==='campaign'?selected.id:''})}else if(name.startsWith('add:')){let [,type,role]=name.split(':');modal(type,null,{...(role?{role}:{}),...(selected?.type==='campaign'?{campaign_id:selected.id}:{})})}}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importTickets(){let el=document.createElement('div');el.className='modalbg';el.innerHTML=`<div class="modal"><header><h2>Import SweatPals report</h2><button class="close">×</button></header><p class="sub">Import a CSV export from SweatPals. The app reads your file locally, then saves the sourced report to your workspace. No estimated sales.</p><form id="csvform" class="form"><label>Campaign<select class="field" name="campaign" required>${state.campaigns.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label>CSV report<input class="field" name="file" type="file" accept=".csv,text/csv" required></label><p class="sub">Supported headers: Tickets Sold / Quantity / Orders and Revenue / Gross Sales / Total. If these are absent, import will stop instead of guessing.</p><button class="btn primary">Review and import</button></form></div>`;document.body.append(el);el.querySelector('.close').onclick=()=>el.remove();el.querySelector('form').onsubmit=async e=>{e.preventDefault();let f=e.target.elements.file.files[0],rows=parseCSV(await f.text());if(rows.length<2)return notify('CSV has no data rows');let heads=rows[0].map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]/g,''));let locate=(opts)=>heads.findIndex(h=>opts.includes(h));let soldCol=locate(['ticketssold','quantity','tickets','orders','totalorders']),revenueCol=locate(['revenue','grosssales','totalrevenue','grossrevenue','total']);if(soldCol<0&&revenueCol<0)return notify('No recognised sales or revenue column. No data imported.');let n=0,sold=0,revenue=0;for(let r of rows.slice(1)){let a=soldCol<0?'':r[soldCol],b=revenueCol<0?'':r[revenueCol];let qty=Number(String(a||'').replace(/[$, ]/g,'')),amt=Number(String(b||'').replace(/[$, ]/g,''));if((a&&!Number.isFinite(qty))||(b&&!Number.isFinite(amt)))continue;n++;sold+=qty||0;revenue+=amt||0}if(!n)return notify('No valid numeric rows found.');let label=`${f.name} · ${new Date().toLocaleDateString()}`;if(!confirm(`Import ${n} valid rows?\nTickets: ${soldCol>=0?sold:'not provided'}\nRevenue: ${revenueCol>=0?'$'+revenue.toFixed(2):'not provided'}\nConfirm the CSV contains ticket-level rows rather than summary totals before continuing.`))return;state.tickets.push({id:id(),label,campaign_id:e.target.elements.campaign.value,sold:soldCol>=0?sold:'',revenue:revenueCol>=0?revenue:'',source:'SweatPals CSV · '+f.name,report_date:new Date().toISOString().slice(0,10),rows:n});el.remove();save('Imported SweatPals CSV',label)}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-action],[data-open],[data-tab],[data-view],[data-month],[data-date]');if(!t)return;if(t.dataset.nav){page=t.dataset.nav;selected=null;filter='';render()}else if(t.dataset.action)action(t.dataset.action);else if(t.dataset.open){let [type,key]=t.dataset.open.split(':');if(type==='campaign'){selected={type,id:key};filter='';render()}else if(type==='person'){selected={type,id:key};render()}else if(type==='editcampaign'){modal('campaign',state.campaigns.find(x=>x.id===key))}else if(type==='editperson'){modal('person',state.people.find(x=>x.id===key))}else{let kind=type==='ticket'?'ticket':type,rec=state[specs[kind]?.collection]?.find(x=>x.id===key);if(rec)modal(kind,rec)}}else if(t.dataset.tab){filter=t.dataset.tab;render()}else if(t.dataset.view){view=t.dataset.view;render()}else if(t.dataset.month){let [y,m]=month.split('-').map(Number);month=new Date(y,m-1+Number(t.dataset.month),1).toISOString().slice(0,7);render()}else if(t.dataset.date&&!e.target.closest('[data-open]'))modal('content',null,{date:t.dataset.date,campaign_id:filter})});document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){filter=e.target.value;render()}});let dragged='';document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(el){dragged=el.dataset.drag;e.dataTransfer.setData('text/plain',dragged)}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-date]'))e.preventDefault()});document.addEventListener('drop',e=>{let day=e.target.closest('[data-date]');if(day&&dragged){e.preventDefault();let post=state.content.find(x=>x.id===dragged);if(post){post.date=day.dataset.date;save('Rescheduled content',post.title)}dragged=''}});boot();
</script></body></html>

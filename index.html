/* 2026-10 visual refresh: neutral, crisp, modern. OTT yellow kept as the accent only. */

.panel{border-color:var(--line);box-shadow:0 1px 2px rgba(16,16,20,.04)}

h1{font-weight:800;letter-spacing:-.045em}h2,h3{font-weight:700}
.chip{background:var(--soft);font-weight:600;color:#2c2c30}.chip.sourcegood,.sourcegood{background:#e6f4ea!important;color:#1d6b35}.chip.warn{background:#fdecd2;color:#8a4b00}
.badge{font-weight:700}
.light{font-weight:700}
.event:before{background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.72) 100%),var(--photo,linear-gradient(140deg,#2b2b2f,#0e0e10))}
.visual{background-color:#ececef}.visual .initial{background:linear-gradient(140deg,#2b2b2f,#55555c);font-weight:800;letter-spacing:-2px}
.thumb{background-color:var(--soft)}
.field{border-color:var(--line);border-radius:12px}.field:focus{outline:none;border-color:#0f0f10;box-shadow:0 0 0 3px rgba(255,210,0,.45)}
.modal{background:#fff}.modalbg{background:rgba(10,10,12,.45);backdrop-filter:blur(6px)}
.form label{font-weight:600;color:#3a3a3d}

.todaycard{border-color:var(--line)}

.activity,.listrow,.integration{border-color:#efeff1}

.quick{display:flex;gap:10px}

.qbtn:hover{border-color:#0f0f10;transform:translateY(-1px)}

.agenda ul li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#3a3a3f;line-height:1.4}.agenda .odot{width:20px;height:20px;font-size:10px;flex:none}.agenda .hdot{margin-top:5px}
.agenda .agsub{margin:4px 0 0;gap:2px}.agenda .agsub li{font-size:12px;color:#6b6b70}.agenda .agsub li:before{content:"·";margin-right:6px}
.aglink{cursor:pointer}.aglink:hover{text-decoration:underline}
.rocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rock{display:flex;gap:8px;align-items:flex-start}.rock ul{margin:4px 0 0;padding-left:16px;font-size:12px}.rock .odot{width:22px;height:22px;font-size:10px;flex:none}.star{color:#e0a100}
.mev{margin-bottom:8px}.mev b{font-size:13px}.mev ul{margin:4px 0 0}
.mtblock{border-top:1px solid #f0f0f2;padding-top:10px;margin-top:10px}.mtblock:first-of-type{border-top:0;margin-top:0}
.mtdup{grid-column:2/-1;font-size:11px;color:#8a8a90}

 if(live&&goal&&sold!=null){let launched=out<=p.launch,exp=Math.round(curveAt(c,out));if(launched&&exp>5){let ratio=sold/exp;if(ratio<.75)r.push({l:'risk',t:`Tickets behind pace: ${num(sold)} sold, about ${num(exp)} expected by now`,o:'campaign:'+c.id});else if(ratio<.92)r.push({l:'watch',t:`Tickets a little behind: ${num(sold)} of ${num(exp)} expected`,o:'campaign:'+c.id});else r.push({l:'ok',t:`Tickets on pace: ${num(sold)} sold, ${num(exp)} expected`})}}
 else if(live&&!goal)r.push({l:'watch',t:'Set a ticket goal to track pace',o:'campaign:'+c.id});
 let ms=milestones(c),golive=ms.find(m=>/tickets go live/i.test(m.name));if(!live&&golive&&golive.diff<0)r.push({l:'risk',t:`Tickets were planned to go live ${fmtS(golive.date)}`,o:'campaign:'+c.id});
 ms.filter(m=>!m.done&&m.diff<0&&m.days>0&&!/tickets go live/i.test(m.name)).slice(-2).forEach(m=>r.push({l:'watch',t:`Missed push: ${m.name} (${fmtS(m.date)})`,o:'campaign:'+c.id}));
 let od=state.tasks.filter(x=>x.campaign_id===c.id&&x.status!=='Done'&&x.due&&x.due<t);if(od.length)r.push({l:od.length>2?'risk':'watch',t:`${od.length} overdue task${od.length===1?'':'s'}${od[0].owner?' · '+od.map(x=>x.owner).filter((v,i,a)=>v&&a.indexOf(v)===i).join(', '):''}`,o:'tasks:'+c.id});
 let tal=state.bookings.filter(b=>b.campaign_id===c.id&&state.people.find(p=>p.id===b.person_id)?.role==='Talent');if(!tal.length&&out<=35)r.push({l:out<=14?'risk':'watch',t:'No talent booked yet',o:'campaign:'+c.id});
 let unconf=tal.filter(b=>['Inquiry','Hold',''].includes(b.status||''));if(unconf.length&&out<=21)r.push({l:out<=10?'risk':'watch',t:`${unconf.length} talent not confirmed`,o:'campaign:'+c.id});
 let dl=state.deals.filter(d=>d.campaign_id===c.id&&d.due_date&&d.due_date<t&&!['Fulfilled','Renew'].includes(d.status));if(dl.length)r.push({l:'watch',t:`${dl.length} partner obligation${dl.length===1?'':'s'} past due`,o:'campaign:'+c.id});
 let ap=state.content.filter(x=>x.campaign_id===c.id&&['Idea','Draft','Needs approval'].includes(x.status)&&x.date&&daysFrom(x.date)<=3&&daysFrom(x.date)>=0);if(ap.length)r.push({l:'watch',t:`${ap.length} post${ap.length===1?'':'s'} going out soon still need approval`,o:'campaign:'+c.id});
 let lvl=r.some(x=>x.l==='risk')?'risk':r.some(x=>x.l==='watch')?'watch':'ok';return {lvl,label:{risk:'At risk',watch:'Watch',ok:'On track'}[lvl],r}}
function healthPill(c){let h=evHealth(c);if(h.lvl==='done')return '';return `<span class="hpill h-${h.lvl}" title="${esc(h.r.filter(x=>x.l!=='ok').map(x=>x.t).join(' · ')||'Nothing needs attention')}">${h.label}</span>`}
function healthPanel(c){let h=evHealth(c);if(h.lvl==='done')return '';return `<div class="panel span2 hpanel h-${h.lvl}"><div class="row"><h3>Event health</h3><span class="hpill h-${h.lvl}">${h.label}</span></div>${h.r.length?h.r.map(x=>`<div class="hrow ${x.o?'click':''}" ${x.o&&!x.o.startsWith('campaign:')?`data-hgo="${x.o}"`:''}><span class="hdot h-${x.l}"></span><span>${esc(x.t)}</span></div>`).join(''):'<div class="hrow"><span class="hdot h-ok"></span><span>Nothing needs attention right now.</span></div>'}<p class="sub tiny" style="margin-top:8px">Worked out from ticket pace against the ${esc(planOf(c).comp.label)} curve, missed pushes, tasks, talent and partner obligations.</p></div>`}

function cmdOpen(){if(document.querySelector('.cmdk'))return;let el=document.createElement('div');el.className='modalbg cmdk';el.innerHTML=`<div class="cmdbox" role="dialog" aria-label="Search and commands"><input class="cmdin" placeholder="Search events, people, partners or type a command" autocomplete="off"><div class="cmdlist"></div><div class="cmdfoot"><span>↑↓ to move</span><span>Enter to open</span><span>Esc to close</span></div></div>`;document.body.append(el);cmdSel=0;cmdRender();el.querySelector('input').focus();
 el.addEventListener('click',e=>{if(e.target===el)el.remove();let b=e.target.closest('[data-cmd]');if(b)cmdGo(b.dataset.cmd)});
 el.querySelector('input').addEventListener('input',()=>{cmdSel=0;cmdRender()});
 el.querySelector('input').addEventListener('keydown',e=>{let n=el.querySelectorAll('.cmditem').length;if(e.key==='ArrowDown'){e.preventDefault();cmdSel=(cmdSel+1)%Math.max(1,n);cmdRender()}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=(cmdSel-1+n)%Math.max(1,n);cmdRender()}else if(e.key==='Enter'){e.preventDefault();let b=el.querySelectorAll('.cmditem')[cmdSel];if(b)cmdGo(b.dataset.cmd)}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();el.remove()}})}
function cmdGo(go){document.querySelector('.cmdk')?.remove();let i=go.indexOf(':'),k=go.slice(0,i),v=go.slice(i+1);
 if(k==='href'){window.open(v,'_blank','noopener');return}
 if(k==='task'){page='Tasks';selected=null;render();setTimeout(()=>document.querySelector('[data-qadd] input[name=title]')?.focus(),50);return}
 if(k==='handle'){addByHandle(v);return}
 if(k==='profile'){let [a,b]=v.split(':');openProfile(a,b);return}
 let el=document.createElement('div');el.style.display='none';if(k==='nav')el.dataset.nav=v;else if(k==='action')el.dataset.action=v;else if(k==='open')el.dataset.open=v;document.body.append(el);el.click();el.remove()}

   {t:`Attendee goal ${g?num(g):'not set'+(pg?' (plan suggests '+num(pg)+')':'')}.${f?.sold!=null?` Sold today: ${num(f.sold)}${g?' ('+Math.round(f.sold/g*100)+'%)':''}`:' Where are sales today?'}`,lvl:h.lvl},
   {t:c.budget?`Projected expenses ${money(c.budget)}. Is the budget confirmed?`:'Projected expenses: not set yet',o:c.budget?'':'Daria'},

   {t:`${ts.length} open task${ts.length===1?'':'s'}${late?`, ${late} late`:''}${n?' · Phase: '+n.name:''}`}];
  let top=h.r.find(r=>r.l!=='ok');if(top)items.push({t:'Watch: '+top.t,lvl:top.l});

 if(last){let open=state.tasks.filter(x=>x.meeting_id===last.id&&x.status!=='Done');if(open.length)secs.push({h:'Follow-ups from last meeting',items:open.sort((a,b)=>(a.owner||'').localeCompare(b.owner||'')).map(x=>({o:x.owner,t:x.title+(x.due&&x.due<t?' (late)':'')}))})}

function agendaText(){let d=nextMeetDate();return `OTT Monday Meeting\n${d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}):''}\n\n`+buildAgenda().map(s=>`${s.h}\n${s.note?s.note+'\n':''}`+s.items.map(x=>`* ${x.o?x.o+': ':''}${x.t}${x.link?' '+x.link:''}`+(x.sub?'\n'+x.sub.map(y=>`   * ${y}`).join('\n'):'')).join('\n')).join('\n\n')}
function agendaHTML(){return `<div class="agenda">${buildAgenda().map(s=>`<section><b ${s.cid?`data-open="campaign:${s.cid}" class="aglink"`:''}>${esc(s.h)}</b>${s.note?`<span class="sub tiny">${esc(s.note)}</span>`:''}<ul>${s.items.map(x=>`<li>${x.lvl?`<span class="hdot h-${x.lvl}"></span>`:''}${x.o?ownerDot(x.o):''}<span>${esc(x.t)}${x.link?` <a href="${esc(x.link)}" target="_blank" rel="noopener">Open ↗</a>`:''}${x.sub?`<ul class="agsub">${x.sub.map(y=>`<li>${esc(y)}</li>`).join('')}</ul>`:''}</span></li>`).join('')}</ul></section>`).join('')}</div>`}
function meetingsPage(){let ms=meetings().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),nd=nextMeetDate(),mt=state.tasks.filter(x=>x.meeting_id);
 return title('Meetings','Paste your Granola notes. Action items become tasks for the right person, and the next agenda builds itself.',`<button class="btn primary" data-meetadd>+ Add meeting notes</button>`)+
 `<section class="grid g2 meetgrid" style="align-items:start"><div class="panel"><div class="row"><h3>Next meeting</h3><label class="meetdate"><span class="sub tiny">Date</span><input class="field" type="date" value="${nd}" data-meetnext></label></div>
 <div class="meetlinkrow"><span class="sub tiny">Team Google Meet link</span><input class="field" placeholder="https://meet.google.com/abc-defg-hij" value="${esc(meetLink())}" data-meetlink></div>
 ${agendaHTML()}
 <div class="row" style="justify-content:flex-start;gap:8px;margin-top:14px"><button class="btn primary" data-meetcopy>Copy agenda</button><span class="sub tiny">Same format as your Monday meeting doc. Paste into the doc, the invite or the Meet chat.</span></div></div>
 <div><div class="panel"><div class="row"><h3>Recent meetings</h3><span class="sub tiny">${ms.length} saved · ${mt.filter(x=>x.status!=='Done').length} open action items</span></div>
 ${ms.length?ms.slice(0,12).map(m=>{let xs=state.tasks.filter(x=>x.meeting_id===m.id),d=xs.filter(x=>x.status==='Done').length,open=meetOpen===m.id;return `<div class="meetrow ${open?'open':''}"><button class="meethead" data-meetopen="${m.id}"><span class="meetday"><b>${m.date?new Date(m.date+'T12:00:00').getDate():''}</b><i>${m.date?new Date(m.date+'T12:00:00').toLocaleDateString('en-US',{month:'short'}):''}</i></span><span class="meetti"><b>${esc(m.title||'Team meeting')}</b><span class="sub tiny">${xs.length} action item${xs.length===1?'':'s'}${xs.length?` · ${d} done`:''}${m.rocks&&Object.keys(m.rocks).length?' · rocks':''}${m.decisions?.length?` · ${m.decisions.length} decision${m.decisions.length===1?'':'s'}`:''}</span></span><span class="meetatt">${(m.attendees||[]).slice(0,6).map(ownerDot).join('')}</span><span class="pbchev">${open?'−':'+'}</span></button>
 ${open?`<div class="meetbody">${xs.length?`<h4>Action items</h4>${xs.map(x=>taskCard(x)).join('')}`:''}${m.ooo?.length?`<h4>OOO</h4><ul>${m.ooo.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${m.rocks&&Object.keys(m.rocks).length?`<h4>Big rocks</h4><div class="rocks">${Object.entries(m.rocks).map(([o,rs])=>`<div class="rock">${ownerDot(o)}<div><b>${esc(o)}</b>${rs.reassign?' <span class="sub tiny">reassign</span>':''}<ul>${rs.map(r=>`<li>${r.star?'<span class="star">★</span> ':''}${esc(r.t)}</li>`).join('')}</ul></div></div>`).join('')}</div>`:''}${Object.values(m.events||{}).length?`<h4>Events discussed</h4>${Object.values(m.events).map(e=>`<div class="mev"><b ${e.cid?`data-open="campaign:${e.cid}" class="aglink"`:''}>${esc(e.cid?campaignName(e.cid):e.label)}</b><ul>${e.notes.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}`:''}${m.decisions?.length?`<h4>Decisions</h4><ul>${m.decisions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${m.questions?.length?`<h4>Open questions</h4><ul>${m.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${m.summary?.length?`<details><summary>Full notes</summary><div class="meetnotes">${mdLite(m.summary)}</div></details>`:''}<div class="row" style="justify-content:flex-start;gap:10px;margin-top:10px">${m.link?`<a class="linkbtn" href="${esc(m.link)}" target="_blank" rel="noopener">Open in Granola ↗</a>`:''}<button class="linkbtn red" data-meetdel="${m.id}">Delete meeting</button></div></div>`:''}</div>`}).join(''):`<div class="quiet">No meetings yet. After your next Google Meet, copy the notes from Granola and click <b>Add meeting notes</b>.</div>`}</div></div></section>`}
function openMeetModal(){document.querySelectorAll('.mtbg').forEach(x=>x.remove());meetDraft=null;let el=document.createElement('div');el.className='modalbg mtbg';
 el.innerHTML=`<div class="modal mtmodal" role="dialog" aria-modal="true"><header><h2>Add meeting notes</h2><button class="close" data-mtclose aria-label="Close">×</button></header><div class="mtstep1"><div class="grid g2" style="gap:10px"><label>Meeting<input class="field" name="title" value="OTT Monday Meeting"></label><label>Date<input class="field" type="date" name="date" value="${localISO()}"></label></div>
 <label style="display:block;margin-top:10px">Granola notes<textarea class="field mtpaste" name="notes" rows="12" placeholder="In Granola, open the note, click Copy, then paste here. You can paste more than one meeting at once if each starts with its date (like 10/5/2026)."></textarea></label>
 <div class="grid g2" style="gap:10px;margin-top:10px"><label>Granola link (optional)<input class="field" name="link" placeholder="https://notes.granola.ai/..."></label><label>Next meeting<input class="field" type="date" name="next" value="${nextMeetDate()}"></label></div>
 <div class="row" style="margin-top:12px"><span class="sub tiny">Nothing is saved until you review it.</span><button class="btn primary" data-mtparse>Find action items</button></div></div><div class="mtstep2"></div></div>`;
 document.body.append(el);el.querySelector('textarea').focus();el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-mtclose]')){el.remove();return}if(e.target.closest('[data-mtparse],[data-mtsave],[data-mtback],[data-mtaddrow]')){e.stopPropagation();extraClick16(e)}})}
function mtField(n){return document.querySelector(`.mtmodal [name="${n}"]`)?.value||''}
function openTaskKey(x){return (x.title||'').toLowerCase().replace(/\W+/g,' ').trim()+'|'+(x.campaign_id||'')+'|'+(x.owner||'')}
function mtPreview(){let txt=mtField('notes');if(!txt.trim())return notify('Paste the Granola notes first');let fdate=mtField('date')||localISO(),next=mtField('next'),title=mtField('title').trim()||'OTT Monday Meeting';
 let chunks=splitMeetings(txt,fdate).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),have=new Set(state.tasks.filter(x=>x.status!=='Done').map(openTaskKey)),seen=new Set();
 meetDraft={link:mtField('link').trim(),next_date:next,meetings:chunks.map((c,i)=>{let p=parseNotes(c.text,c.date,i===0?next:'');p.actions.forEach(a=>{let k=openTaskKey({title:a.text,campaign_id:a.campaign_id,owner:a.owner});a.dup=have.has(k)||seen.has(k);seen.add(k);a.on=i===0&&!a.dup});return {title:(c.title&&!/^\d/.test(c.title)?c.title:title),date:c.date,attendees:attendeesIn(c.text),...p}})};
 mtRender()}
function mtRowHTML(a,mi,i,evs){return `<div class="mtact ${a.owner?'':'noown'}" data-m="${mi}" data-i="${i}"><input type="checkbox" ${a.on?'checked':''} data-mtk="on" aria-label="Create this task"><input class="field" value="${esc(a.text)}" placeholder="What needs to happen" data-mtk="text"><select class="field" data-mtk="owner"><option value="">Who owns this?</option>${TEAM.map(([n])=>`<option ${n===a.owner?'selected':''}>${n}</option>`).join('')}</select><input class="field" type="date" value="${a.due}" data-mtk="due"><select class="field" data-mtk="campaign_id"><option value="">No event</option>${evs.map(c=>`<option value="${c.id}" ${c.id===a.campaign_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${a.dup?'<span class="mtdup">Already on Tasks</span>':''}</div>`}
function mtRender(){let d=meetDraft;if(!d)return;document.querySelector('.mtstep1').style.display='none';let evs=state.campaigns.filter(c=>(c.date||'')>=localISO(addDaysD(new Date(),-45))).sort((a,b)=>a.date.localeCompare(b.date));
 document.querySelector('.mtstep2').innerHTML=`${d.meetings.length>1?`<p class="sub">Found <b>${d.meetings.length} meetings</b>: ${d.meetings.map(m=>fmtS(m.date)).join(', ')}. Only the newest one's action items are checked; older ones are saved for history.</p>`:''}
 ${d.meetings.map((m,mi)=>`<div class="mtblock"><div class="row"><b>${esc(m.title)} · ${fmtS(m.date)}</b><span class="sub tiny">${m.actions.length} action item${m.actions.length===1?'':'s'}${Object.keys(m.rocks).length?` · rocks for ${Object.keys(m.rocks).join(', ')}`:''}${m.ooo.length?` · ${m.ooo.length} OOO note${m.ooo.length===1?'':'s'}`:''}${Object.keys(m.events).length?` · ${Object.keys(m.events).length} events`:''}</span></div>
 <div class="mtacts">${m.actions.map((a,i)=>mtRowHTML(a,mi,i,evs)).join('')||'<div class="quiet">No action items found in this one.</div>'}</div>${mi===0?'<button class="linkbtn" data-mtaddrow>+ Add an action item</button>':''}</div>`).join('')}
 <div class="row" style="margin-top:14px"><button class="btn" data-mtback>Back</button><button class="btn primary" data-mtsave>Save${d.meetings.length>1?' '+d.meetings.length+' meetings':' meeting'} + create checked tasks</button></div>`}
function mtSync(){if(!meetDraft)return;document.querySelectorAll('.mtact').forEach(r=>{let a=meetDraft.meetings[+r.dataset.m]?.actions[+r.dataset.i];if(!a)return;r.querySelectorAll('[data-mtk]').forEach(f=>{a[f.dataset.mtk]=f.type==='checkbox'?f.checked:f.value})})}
function mtSave(){mtSync();let d=meetDraft;if(!d)return;let n=0,noOwner=0,first=null;
 for(const [mi,x] of d.meetings.entries()){let m={id:id(),title:x.title,date:x.date,next_date:mi===0?d.next_date:'',link:mi===0?d.link:'',attendees:x.attendees,summary:x.summary,decisions:x.decisions,questions:x.questions,ooo:x.ooo,rocks:x.rocks,events:x.events,source:'granola',created_at:new Date().toISOString()};meetings().push(m);if(!first)first=m;
  for(const a of x.actions){if(!a.on||!String(a.text).trim())continue;let tk={id:id(),title:String(a.text).trim().slice(0,200),owner:a.owner||'',collab:a.collab||'',due:a.due||'',campaign_id:a.campaign_id||'',status:'Open',meeting_id:m.id};state.tasks.push(tk);n++;if(!tk.owner)noOwner++;else if(typeof notifyAssign==='function')notifyAssign(tk,'meeting')}}
 document.querySelectorAll('.mtbg').forEach(x=>x.remove());meetDraft=null;meetOpen=first?.id||'';save('Saved meeting notes',first?.title||'');notify(`Saved${d.meetings.length>1?' '+d.meetings.length+' meetings':''}${n?`, ${n} task${n===1?'':'s'} created`:''}${noOwner?` (${noOwner} without an owner)`:''}`)}
function extraClick16(e){let t=e.target.closest('[data-meetadd],[data-meetopen],[data-meetcopy],[data-meetdel],[data-mtparse],[data-mtsave],[data-mtback],[data-mtaddrow],[data-quicknotes]');if(!t)return false;
 if(t.hasAttribute('data-quicknotes')){let m=lastMeeting();page='Meetings';selected=null;meetOpen=m?.id||'';render();if(!m)openMeetModal();else setTimeout(()=>document.querySelector('.meetrow.open')?.scrollIntoView({behavior:'smooth',block:'start'}),80);return true}
 if(t.hasAttribute('data-meetadd')){openMeetModal();return true}
 if(t.dataset.meetopen){meetOpen=meetOpen===t.dataset.meetopen?'':t.dataset.meetopen;render();return true}
 if(t.hasAttribute('data-meetcopy')){let s=agendaText();(navigator.clipboard?.writeText(s)||Promise.reject()).then(()=>notify('Agenda copied')).catch(()=>{let ta=document.createElement('textarea');ta.value=s;document.body.append(ta);ta.select();try{document.execCommand('copy');notify('Agenda copied')}catch(_){}ta.remove()});return true}
 if(t.dataset.meetdel){let m=meetings().find(x=>x.id===t.dataset.meetdel);if(!m)return true;state.meetings=meetings().filter(x=>x.id!==m.id);save('Deleted meeting',m.title);notify('Meeting deleted. Its tasks stay on the Tasks page.');return true}
 if(t.hasAttribute('data-mtparse')){mtPreview();return true}
 if(t.hasAttribute('data-mtback')){mtSync();document.querySelector('.mtstep2').innerHTML='';document.querySelector('.mtstep1').style.display='';return true}
 if(t.hasAttribute('data-mtaddrow')){mtSync();meetDraft.meetings[0].actions.push({id:id(),text:'',owner:'',due:meetDraft.next_date||localISO(addDaysD(new Date(),7)),campaign_id:'',on:true});mtRender();return true}

 return false}

document.addEventListener('change',e=>{if(e.target.matches?.('[data-meetnext]')){let m=lastMeeting(),v=e.target.value;if(m)m.next_date=v;else state.meta_next_meeting=v;save('Set next meeting',v)}
 if(e.target.matches?.('[data-meetlink]')){let v=e.target.value.trim();if(v&&!/^https:\/\/meet\.google\.com\//.test(v)){notify('That does not look like a Google Meet link');return}state.meet_link=v;save('Set team Meet link','')}
 if(e.target.matches?.('.mtact [data-mtk="owner"]'))e.target.closest('.mtact').classList.toggle('noown',!e.target.value)});

=>x.id===dragged);if(post){post.date=day.dataset.date;save('Rescheduled content',post.title)}dragged=''}});boot();

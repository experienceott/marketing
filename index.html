function mergeStates(baseS,mine,theirs){baseS=baseS||{};let out=structuredClone(theirs||{});for(let k of new Set([...Object.keys(mine||{}),...Object.keys(out)])){let m=mine?.[k],b=baseS[k],t=out[k];if(Array.isArray(m)){t=Array.isArray(t)?t:[];if(k==='activity'){let seen=new Set();out[k]=[...m,...t].filter(x=>x&&!seen.has(x.id)&&seen.add(x.id)).sort((a,c)=>String(c.date).localeCompare(String(a.date))).slice(0,500);continue}let bm=new Map((Array.isArray(b)?b:[]).map(x=>[x.id,JSON.stringify(x)])),mm=new Map(m.map(x=>[x.id,x]));let res=t.filter(x=>!(bm.has(x.id)&&!mm.has(x.id)));for(let x of m){let before=bm.get(x.id);if(before!==undefined&&before===JSON.stringify(x))continue;let i=res.findIndex(y=>y.id===x.id);if(i>=0)res[i]=x;else res.push(x)}out[k]=res}else if(m!==undefined&&JSON.stringify(m)!==JSON.stringify(b))out[k]=m}return out}
async function pushCloud(){savingNow=true;try{let r=await client.rpc('ott_save_workspace',{p_id:WS,p_data:state,p_expected_revision:cloudRevision});if(!r.error){cloudRevision=r.data;base=structuredClone(state);cloudEmpty=false;return}let latest=await client.from('workspaces').select('data,revision').eq('id',WS).maybeSingle();if(latest.error||!latest.data)throw r.error;state=normalizeState(mergeStates(base,state,latest.data.data));cloudRevision=latest.data.revision||0;let again=await client.rpc('ott_save_workspace',{p_id:WS,p_data:state,p_expected_revision:cloudRevision});if(again.error)throw again.error;cloudRevision=again.data;base=structuredClone(state);writeLocal(K+'_cloud',state);notify('Merged with a teammate’s latest changes')}finally{savingNow=false}}

function personFacts(p,next,past){let n=v=>{let x=Number(String(v??'').replace(/[$,%\s]/g,''));return String(v??'').trim()&&isFinite(x)?x:null};if(p.role==='Creator'){let sales=n(p.referral_sales),rate=n(p.commission_rate),owed=sales!=null&&rate!=null?sales*rate/100:null;return [['Audience (verified)',p.audience||'Not verified'],['Platforms',p.platforms||'Not added'],['Relationship owner',p.relationship_owner||'Unassigned'],['Reliability',p.reliability||'Not rated'],['Partner fit',p.partner_fit||'Not added'],['Current opportunity',p.current_opportunity||'None'],['Deliverables',p.deliverables||'None'],['Past OTT activations',String(past.length)],['Referral sales',sales!=null?money(sales):'Not tracked'],['Commission',owed!=null?`${money(owed)} at ${rate}%`:rate!=null?rate+'% (no sales recorded)':p.commission||'Not set'],['Payout',p.payout_status||'Not started'],['Content rights',p.content_rights||'Not recorded']]}return [['Next booking',next?`${campaignName(next.campaign_id)} · ${fmt(next.date)}${next.set_time?' · '+next.set_time:''}`:'None'],['Rate',p.fee||'Not added'],['Manager / contact',p.manager||p.email||'Not added'],['Contract',next?.contract_status||p.contract_status||'Not tracked'],['Promo',next?.promo_requirements||p.promo_status||'Not tracked'],['Payment',next?.payment_status||p.payment_status||'Not tracked'],['Guest list',next?.guest_list||p.guest_list||'None'],['Past OTT bookings',String(past.length)]]}

function uploadInto(btn){if(!canUpload()){notify('Sign in to upload to OTT storage');return}let form=btn.closest('form'),input=form?.querySelector(`[name="${btn.dataset.upload}"]`);if(!input)return;let f=document.createElement('input');f.type='file';f.accept='image/*,video/*,application/pdf';f.onchange=async()=>{let file=f.files[0];if(!file)return;if(file.size>50*1024*1024){notify('Files over 50 MB should stay in Dropbox');return}let label=btn.textContent;btn.disabled=true;btn.textContent='Uploading…';try{let safe=file.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-').slice(-60),path=`${localISO().slice(0,7)}/${id()}-${safe}`;let {error}=await client.storage.from(MEDIA_BUCKET).upload(path,file,{cacheControl:'31536000',upsert:false,contentType:file.type||undefined});if(error)throw error;input.value=client.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;notify('Uploaded to OTT storage')}catch(e){console.error(e);notify('Upload failed: '+(e.message||'storage not ready'))}finally{btn.disabled=false;btn.textContent=label}};f.click()}

function download(name,text,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function extraAction(name){if(name==='localpreview'){localPreview=true;setPreview(true);render();return true}
 if(name==='signout'){(async()=>{try{await client.auth.signOut()}catch(e){}user=null;mode='local';cloudReady=false;render()})();return true}
 if(name==='exportbackup'){download(`ott-studio-backup-${localISO()}.json`,JSON.stringify({app:'OTT Studio',exported:new Date().toISOString(),mode,data:state},null,1));return true}
 if(name==='importbackup'){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let j=JSON.parse(await f.files[0].text()),d=normalizeState(j.data||j);if(!confirm(`Restore backup?\n${d.campaigns.length} campaigns · ${d.content.length} content · ${d.people.length} people\nRecords are merged; matching IDs take the backup version.`))return;state=normalizeState(mergeStates({},d,state));save('Restored backup',f.files[0].name)}catch(e){notify('That file is not an OTT Studio backup')}};f.click();return true}
 if(name==='pushlocal'){let l=normalizeState(readLocal(K));state=normalizeState(mergeStates({},l,state));save('Moved local preview records to team',`${l.content.length} content · ${l.people.length} people`).then(()=>{if(mode==='cloud'){try{localStorage.setItem(K+'_migrated_'+Date.now(),JSON.stringify(l));localStorage.removeItem(K)}catch(e){}render()}});return true}
 if(name==='refreshlive'){loadLive();return true}
 if(name==='syncnow'){(async()=>{notify('Syncing social data…');try{let {data,error}=await client.functions.invoke('metricool-sync',{body:{trigger:'manual'}});if(error)throw error;notify(data?.status==='ok'?'Social data synced':'Sync finished: '+(data?.message||data?.status||'see Insights'))}catch(e){notify('Sync failed: '+(e.message||e))}loadLive()})();return true}
 if(name.startsWith('addbooking:')){modal('booking',null,{person_id:name.split(':')[1]});return true}
 return false}

// ---------- SweatPals CSV: real exports (ticket-level + orders), reviewed before saving ----------
function analyzeTicketCSV(rows){let H=rows[0].map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]/g,'')),col=(...n)=>H.findIndex(h=>n.includes(h)),data=rows.slice(1).map(r=>Object.fromEntries(H.map((h,i)=>[h,(r[i]??'').trim()]))),money2=v=>{let x=Number(String(v||'').replace(/[$,\s]/g,''));return isFinite(x)?x:0},dayOf=v=>{let d=new Date(v);return isNaN(d)?'':localISO(d)};let addonRe=/parking|add-?on/i,evs=()=>{let c={};data.forEach(x=>{c[x.eventname||'']=(c[x.eventname||'']||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])};
 if(col('ticketid')>=0&&col('tier')>=0){let events=evs();return {format:'SweatPals tickets export',events,build(ev){let rs=data.filter(x=>events.length<2||(x.eventname||'')===ev),ok=rs.filter(x=>!/refund|cancel|void/i.test(x.status||'')),adm=ok.filter(x=>!addonRe.test(x.tier||'')),tiers={},daily={};ok.forEach(x=>{tiers[x.tier||'Unlabelled']=(tiers[x.tier||'Unlabelled']||0)+1});adm.forEach(x=>{let d=dayOf(x.paiddate);if(d)daily[d]=(daily[d]||0)+1});let days=Object.keys(daily).sort();return {sold:adm.length,addons:ok.length-adm.length,refunded:rs.length-ok.length,orders:new Set(ok.map(x=>x.orderid).filter(Boolean)).size,revenue:Math.round(ok.reduce((t,x)=>t+money2(x.orderpaidamount),0)*100)/100,net:'',tiers,daily,rows:rs.length,first:days[0]||'',last:days[days.length-1]||'',event:ev}}}}
 if(col('numberoftickets')>=0&&col('orderpaidamount')>=0){let events=evs();return {format:'SweatPals orders export',events,build(ev){let rs=data.filter(x=>events.length<2||(x.eventname||'')===ev),ok=rs.filter(x=>!/refund|cancel|void/i.test((x.status||'')+(x.transactiontype||''))),daily={};ok.forEach(x=>{let d=dayOf(x.paiddate);if(d)daily[d]=(daily[d]||0)+(Number(x.numberoftickets)||0)});let days=Object.keys(daily).sort(),hasNet=col('netpayout')>=0;return {sold:ok.reduce((t,x)=>t+(Number(x.numberoftickets)||0),0),addons:0,refunded:rs.length-ok.length,orders:ok.length,revenue:Math.round(ok.reduce((t,x)=>t+money2(x.orderpaidamount),0)*100)/100,net:hasNet?Math.round(ok.reduce((t,x)=>t+money2(x.netpayout),0)*100)/100:'',tiers:{},daily,rows:rs.length,first:days[0]||'',last:days[days.length-1]||'',event:ev}}}}
 let soldCol=col('ticketssold','quantity','tickets','totalorders'),revenueCol=col('revenue','grosssales','totalrevenue','grossrevenue','total');if(soldCol<0&&revenueCol<0)return null;return {format:'Summary CSV',events:[''],build(){let n=0,sold=0,revenue=0;for(let r of rows.slice(1)){let a=soldCol<0?'':r[soldCol],b=revenueCol<0?'':r[revenueCol],q=Number(String(a||'').replace(/[$, ]/g,'')),m=Number(String(b||'').replace(/[$, ]/g,''));if((a&&!isFinite(q))||(b&&!isFinite(m)))continue;n++;sold+=q||0;revenue+=m||0}return {sold:soldCol>=0?sold:'',addons:0,refunded:0,orders:'',revenue:revenueCol>=0?revenue:'',net:'',tiers:{},daily:{},rows:n,first:'',last:'',event:''}}}}
function importTickets(){let el=document.createElement('div');el.className='modalbg';let cid=selected?.type==='campaign'?selected.id:'';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><header><h2>Import SweatPals report</h2><button class="close" aria-label="Close">×</button></header><p class="sub">Use SweatPals → event → Export (tickets/attendees) or the Orders export. The file is read in this browser; only totals, tiers and daily counts are saved. Names, emails and phone numbers are never stored.</p><form id="csvform" class="form"><label>Campaign<select class="field" name="campaign" required>${state.campaigns.map(c=>`<option value="${esc(c.id)}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>CSV report<input class="field" name="file" type="file" accept=".csv,text/csv" required></label><div id="csvreview"></div><div class="row"><button class="btn primary" id="csvgo">Review</button></div></form></div>`;document.body.append(el);el.querySelector('.close').onclick=()=>el.remove();el.addEventListener('click',e=>{if(e.target===el)el.remove()});let parsed=null,pick='',result=null,fileName='';let show=()=>{let rv=el.querySelector('#csvreview');result=parsed.build(pick);let x=result;rv.innerHTML=`<div class="perfbox"><div class="eyebrow">${esc(parsed.format)} · ${esc(fileName)}</div>${parsed.events.length>1?`<label style="margin:10px 0">Event in this file<select class="field" id="csvevent">${parsed.events.map(ev=>`<option ${ev===pick?'selected':''} value="${esc(ev)}">${esc(ev||'(no event name)')}</option>`).join('')}</select></label>`:x.event?`<b>${esc(x.event)}</b>`:''}<div class="profilefacts four" style="margin-top:10px">${fact('Tickets',num(x.sold))}${fact(x.net!==''?'Gross paid':'Revenue',money(x.revenue))}${fact('Orders',num(x.orders))}${fact(x.net!==''?'Net payout':'Add-ons',x.net!==''?money(x.net):num(x.addons))}</div><div class="sub tiny" style="margin-top:8px">${num(x.rows)} rows · ${num(x.refunded)} refunded/cancelled excluded${x.first?` · sales ${fmt(x.first)} → ${fmt(x.last)}`:''}${x.addons?' · parking/add-on tiers counted separately':''}</div>${velocityBars(Object.keys(x.daily).length?x.daily:null)}</div>`;let sel=rv.querySelector('#csvevent');if(sel)sel.onchange=()=>{pick=sel.value;show()};el.querySelector('#csvgo').textContent='Import this report'};
 el.querySelector('form').onsubmit=async e=>{e.preventDefault();if(!parsed){let f=e.target.elements.file.files[0];if(!f)return;fileName=f.name;let rows=parseCSV((await f.text()).replace(/^﻿/,''));if(rows.length<2)return notify('CSV has no data rows');parsed=analyzeTicketCSV(rows);if(!parsed)return notify('No recognised SweatPals or sales columns. No data imported.');let camp=state.campaigns.find(c=>c.id===e.target.elements.campaign.value);pick=parsed.events.find(ev=>matchEvent(ev,camp?.sweatpals_event))??parsed.events[0]??'';e.target.elements.file.onchange=()=>{parsed=null;el.querySelector('#csvreview').innerHTML='';el.querySelector('#csvgo').textContent='Review'};show();return}
  let x=result,cidSel=e.target.elements.campaign.value,camp=state.campaigns.find(c=>c.id===cidSel);if(x.rows<1)return notify('No rows for that event');let label=`${x.event||fileName} · ${new Date().toLocaleDateString()}`;state.tickets.push({id:id(),label,campaign_id:cidSel,sold:x.sold,addons:x.addons,refunded:x.refunded,orders:x.orders,revenue:x.revenue,net:x.net,tiers:x.tiers,daily:x.daily,event_name:x.event,source:`SweatPals CSV · ${parsed.format.replace('SweatPals ','')} · ${fileName}`,report_date:localISO(),last_sale:x.last,imported_at:new Date().toISOString(),rows:x.rows});if(camp&&x.event&&!camp.sweatpals_event)camp.sweatpals_event=x.event;el.remove();save('Imported SweatPals CSV',label)}}

// ---------- live event countdowns (tick every second, no re-render) ----------
function eventStart(c){if(!c?.date)return null;let [y,m,d]=c.date.split('-').map(Number),[hh,mm]=(c.start_time||'00:00').split(':').map(Number);return new Date(y,m-1,d,hh||0,mm||0)}
function countdownText(c){let t=eventStart(c);if(!t)return '';let ms=t-Date.now(),today=localISO();if(c.date===today&&(ms<=0||!c.start_time))return 'Happening today';if(ms<=0)return c.date<today?'Event complete':'Happening now';let s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),mi=Math.floor(s%3600/60),se=s%60,p=n=>String(n).padStart(2,'0');return `${d}<i>d</i> ${p(h)}<i>h</i> ${p(mi)}<i>m</i> ${p(se)}<i>s</i>`}
function countdownHTML(c){let t=countdownText(c);if(!t)return '';return `<div class="countdown" data-countdown="${esc(c.id)}"><span class="cdlabel">${c.start_time?'Doors in':'Countdown'}</span><b>${t}</b></div>`}
setInterval(()=>{document.querySelectorAll('[data-countdown]').forEach(el=>{let c=state.campaigns.find(x=>x.id===el.dataset.countdown),b=el.querySelector('b');if(c&&b){let t=countdownText(c);if(b.innerHTML!==t)b.innerHTML=t}})},1000);

document.addEventListener('click',e=>{let st=e.target.closest('[data-stage]');if(st){setStage(st.dataset.person,st.dataset.stage);return}let up=e.target.closest('[data-upload]');if(up){uploadInto(up);return}let t=e.target.closest('[data-nav],[data-action],[data-open],[data-tab],[data-view],[data-month],[data-date]');if(!t)return;if(t.dataset.nav){page=t.dataset.nav;selected=null;filter='';render()}else if(t.dataset.action)action(t.dataset.action);else if(t.dataset.open){let [type,...rest]=t.dataset.open.split(':'),key=rest.join(':');if(type==='extpost'){let p=live.posts.find(x=>x.platform+':'+x.post_id===key);if(p?.url)window.open(p.url,'_blank','noopener');return}if(type==='campaign'){selected={type,id:key};filter='';render()}else if(type==='person'){selected={type,id:key};render()}else if(type==='editcampaign'){modal('campaign',state.campaigns.find(x=>x.id===key))}else if(type==='editperson'){modal('person',state.people.find(x=>x.id===key))}else{let kind=type==='ticket'?'ticket':type,rec=state[specs[kind]?.collection]?.find(x=>x.id===key);if(rec)modal(kind,rec)}}else if(t.dataset.tab){filter=t.dataset.tab;render()}else if(t.dataset.view){view=t.dataset.view;render()}else if(t.dataset.month){let [y,m]=month.split('-').map(Number);month=localISO(new Date(y,m-1+Number(t.dataset.month),1)).slice(0,7);render()}else if(t.dataset.date&&!e.target.closest('[data-open]'))modal('content',null,{date:t.dataset.date,campaign_id:filter})});document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){filter=e.target.value;render()}});let dragged='';document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(el){dragged=el.dataset.drag;e.dataTransfer.setData('text/plain',dragged)}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-date]'))e.preventDefault()});document.addEventListener('drop',e=>{let day=e.target.closest('[data-date]');if(day&&dragged){e.preventDefault();let post=state.content.find(x=>x.id===dragged);if(post){post.date=day.dataset.date;save('Rescheduled content',post.title)}dragged=''}});boot();

/* 2026-10 visual refresh: neutral, crisp, modern. OTT yellow kept as the accent only. */

.panel{border-color:var(--line);box-shadow:0 1px 2px rgba(16,16,20,.04)}

h1{font-weight:800;letter-spacing:-.045em}h2,h3{font-weight:700}
.chip{background:var(--soft);font-weight:600;color:#2c2c30}.chip.sourcegood,.sourcegood{background:#e6f4ea!important;color:#1d6b35}.chip.warn{background:#fdecd2;color:#8a4b00}
.badge{font-weight:700}
.light{font-weight:700}
.event:before{background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.72) 100%),var(--photo,linear-gradient(140deg,#2b2b2f,#0e0e10))}
.visual{background-color:#ececef}.visual .initial{background:linear-gradient(140deg,#2b2b2f,#55555c);font-weight:800;letter-spacing:-2px}
.thumb{background-color:var(--soft)}
.field{border-color:var(--line);border-radius:12px}.field:focus{outline:none;border-color:#0f0f10;box-shadow:0 0 0 3px rgba(242,214,10,.45)}
.modal{background:#fff}.modalbg{background:rgba(10,10,12,.45);backdrop-filter:blur(6px)}
.form label{font-weight:600;color:#3a3a3d}
.day{border-color:var(--line);border-radius:12px;background:#fff}.day:hover{border-color:#cfcfd4}

.todaycard{border-color:var(--line)}

 if(book.length)blocks.push(`<div class="panel"><div class="row"><h3>Lineup</h3><button class="btn" data-action="add:booking">+ Assign</button></div><div class="lineup">${book.map(b=>{let p=state.people.find(x=>x.id===b.person_id);return p?`<div class="lu" data-open="person:${p.id}">${avatarHTML(p,64)}<b>${esc(p.name)}</b><span class="sub tiny">${esc(b.status||'')}${b.set_time?' · '+esc(b.set_time):''}</span></div>`:''}).join('')}</div></div>`);
 if(assets.length)blocks.push(`<div class="panel"><div class="row"><h3>Photos</h3><button class="btn" data-tab="Assets">All</button></div><div class="phgrid">${assets.slice(0,6).map(a=>`<span data-open="asset:${a.id}" style="background-image:${photo(a.url)}"></span>`).join('')}</div></div>`);
 if(!past)blocks.push(`<div class="panel span2"><div class="row"><h3>Full timeline</h3><span class="sub tiny">${esc(sizeOf(c))} guests</span></div>${msList(c)}</div>`);
 let adds=[['add:content','+ Post'],['add:task','+ Task'],['add:booking','+ Assign talent'],['add:partner','+ Partner'],['add:ticket','+ Ticket report'],['add:asset','+ Photo']];
 return `<div class="grid g2 cover" style="align-items:start">${blocks.join('')}</div><div class="addrow">${adds.map(([a,l])=>`<button class="btn" data-action="${a}">${l}</button>`).join('')}</div>`}
function ticketCard(c,tf){let d=tf.daily?Object.entries(tf.daily).sort((a,b)=>a[0].localeCompare(b[0])):[],cum=0,cv=d.map(([,v])=>cum+=v);return `<div class="row"><h3>Tickets</h3><span class="sub tiny">${esc(tf.source.split('·')[0].trim())} · ${esc(tf.asOfLabel)}</span></div><div class="tixstats"><div><b>${num(tf.sold)}</b><span class="sub tiny">tickets</span></div><div><b>${tf.revenue?'$'+compact(tf.revenue):'—'}</b><span class="sub tiny">revenue</span></div>${tf.orders?`<div><b>${num(tf.orders)}</b><span class="sub tiny">orders</span></div>`:''}${tf.v7!=null?`<div><b>${num(tf.v7)}</b><span class="sub tiny">last 7 days</span></div>`:''}</div>${cv.length?sparkBars(cv,'tall'):''}`}
// ---- campaigns list: add calculator pill ----
function campaignsPage(){if(campView==='planner')return planner();return campaignsPageOld().replace(/(data-cview="all">All<\/button>)/,'$1<button class="btn" data-cview="planner">Timeline calculator</button>')}
// ---- people (Talent + Creators together) ----
function peoplePage(role){if(role==='Creator'&&peopleView==='Board')return creatorBoard();let people=state.people.filter(x=>x.role===role);
 const seg=`<span class="filters"><button class="btn ${role==='Talent'?'black':''}" data-nav="Talent">Talent · ${state.people.filter(x=>x.role==='Talent').length}</button><button class="btn ${role==='Creator'?'black':''}" data-nav="Creator House">Creators · ${state.people.filter(x=>x.role==='Creator').length}</button>${role==='Creator'?`<button class="btn" data-pview="Board">Pipeline</button>`:''}</span>`;
 return title('People','',`<span class="filters"><button class="btn" data-handleadd="${role}">+ From handle</button><button class="btn primary" data-action="add:person:${role}">+ ${role==='Creator'?'Creator':'Talent'}</button></span>`)+`<div style="margin-top:14px">${seg}</div><div class="grid g4 pgrid" style="margin-top:16px">${people.map(p=>{let n=state.bookings.filter(b=>b.person_id===p.id).length,sub=[p.market,p.genre||p.niche].filter(Boolean).join(' · ');return `<div class="panel person pcard" data-open="person:${p.id}">${personThumb(p)}<h3>${esc(p.name)}</h3>${sub?`<div class="sub tiny">${esc(sub)}</div>`:''}<div class="chips">${followerChips(p)}${n?`<span class="chip">${n} booking${n===1?'':'s'}</span>`:''}${p.status&&p.status!=='Active'?`<span class="chip">${esc(p.status)}</span>`:''}</div></div>`}).join('')||`<div class="quiet">No ${role==='Creator'?'creators':'talent'} yet. <button class="linkbtn" data-handleadd="${role}">Add from an Instagram handle</button></div>`}</div>`}
// ---- top bar: grouped nav + search ----
function top(){let groups=[['Home','Home'],['Campaigns','Campaigns'],['Content','Content'],['People','Talent'],['Partners','Partners'],['Assets','Assets'],['Insights','Insights']],cur=selected?.type==='campaign'?'Campaigns':selected?.type==='person'||['Talent','Creator House'].includes(page)?'People':page;
 let nav=`<div class="nav">${groups.map(([l,n])=>`<button class="${cur===l?'on':''}" data-nav="${n}">${l}</button>`).join('')}</div>`;
 let o=topOld(),a=o.indexOf('<div class="nav">'),b=o.indexOf('</div>',a)+6;return (o.slice(0,a)+nav+o.slice(b)).replace('<div class="right">','<div class="right"><div class="gsearch"><input id="gsq" type="search" placeholder="Search" autocomplete="off" aria-label="Search everything"><div class="gsres" id="gsres"></div></div>')}
function searchAll(q){q=q.trim().toLowerCase();if(q.length<2)return [];let hit=s=>String(s||'').toLowerCase().includes(q),r=[];
 state.campaigns.filter(c=>hit(c.name)||hit(c.market)||hit(c.venue)||hit(c.type)).forEach(c=>r.push({k:'Event',t:c.name,s:fmtS(c.date)+(c.market?' · '+c.market:''),o:'campaign:'+c.id,img:c.photo}));
 state.people.filter(p=>hit(p.name)||hit(p.instagram)||hit(p.handle)||hit(p.market)||hit(p.genre)).forEach(p=>r.push({k:p.role==='Creator'?'Creator':'Talent',t:p.name,s:[p.instagram&&'@'+p.instagram,totalFollowers(p)!=null&&compact(totalFollowers(p))+' followers'].filter(Boolean).join(' · '),o:'person:'+p.id,img:personPhoto(p)}));
 allMilestones().filter(m=>hit(m.name)||hit(m.c.name)).slice(0,6).forEach(m=>r.push({k:'Push',t:m.name,s:m.c.name+' · '+fmtS(m.date),o:'campaign:'+m.c.id,img:m.c.photo}));
 state.content.filter(x=>hit(x.title)||hit(x.caption)).forEach(x=>r.push({k:'Post',t:x.title,s:platformLabel(x.platform)+' · '+fmtS(x.date),o:'content:'+x.id,img:x.photo}));
 state.partners.filter(x=>hit(x.name)||hit(x.contact)).forEach(x=>r.push({k:'Partner',t:x.name,s:x.status||'',o:'partner:'+x.id,img:x.logo}));
 state.assets.filter(x=>hit(x.name)||hit(x.source)).forEach(x=>r.push({k:'Photo',t:x.name,s:campaignName(x.campaign_id),o:'asset:'+x.id,img:x.url}));
 igPosts.filter(p=>hit(p.caption)).forEach(p=>r.push({k:'IG post',t:(p.caption||'').split('\n')[0].slice(0,60),s:fmtS(postDay(p))+' · '+num(p.likes)+' likes',href:p.url,img:p.thumbUrl}));
 return r.slice(0,12)}
function searchRender(q){let el=document.getElementById('gsres');if(!el)return;let r=searchAll(q);el.classList.toggle('open',q.trim().length>=2);el.innerHTML=r.length?r.map(x=>`<${x.href?`a href="${esc(x.href)}" target="_blank" rel="noopener"`:`div data-open="${x.o}"`} class="gsitem"><span class="gsimg" style="background-image:${photo(x.img)}"></span><div><b>${esc(x.t)}</b><span class="sub tiny">${esc(x.s)}</span></div><span class="gskind">${x.k}</span></${x.href?'a':'div'}>`).join(''):'<div class="sub tiny" style="padding:12px">No matches</div>'}
document.addEventListener('input',e=>{if(e.target.id==='gsq')searchRender(e.target.value)});
document.addEventListener('keydown',e=>{if((e.key==='k'&&(e.metaKey||e.ctrlKey))||(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))){let i=document.getElementById('gsq');if(i){e.preventDefault();i.focus()}}if(e.key==='Escape'&&e.target.id==='gsq'){e.target.value='';searchRender('')}});
document.addEventListener('change',e=>{let k=e.target.dataset?.calc;if(!k)return;calc[k]=e.target.value;if(k==='ev'){let c=state.campaigns.find(x=>x.id===calc.ev);if(c){calc.date=c.date;calc.size=sizeOf(c)}}render()});
function extraClick5(e){if(!e.target.closest('.gsearch')){let r=document.getElementById('gsres');if(r)r.classList.remove('open')}let t=e.target.closest('[data-csize],[data-calcsize]');if(!t)return false;
 if(t.dataset.calcsize){calc.size=t.dataset.calcsize.split(':').pop();render();return true}
 let [cid,sz]=t.dataset.csize.split(':'),c=state.campaigns.find(x=>x.id===cid);if(c&&SIZE_PROFILES[sz]){c.size=sz;calc.size=sz;save('Set campaign timeline',c.name)}return true}
// ---- settings, assets ----
function teamSetup(){if(typeof TEAM_MODE!=='undefined'&&TEAM_MODE)return teamSetupOld();let ig=ottProf('instagram'),tt=ottProf('tiktok');const row=(n,s,ok)=>`<div class="integration"><div><b>${n}</b><div class="sub">${s}</div></div><span class="chip ${ok?'sourcegood':''}">${ok?'Connected':'Not yet'}</span></div>`;
 return `<div class="panel" style="max-width:720px"><h2>Settings</h2><p class="sub">Everything saves in this browser. No sign-in needed.</p>${row('Instagram','@overthetopxp · public numbers, updated daily',!!ig)}${row('TikTok','@overthetopxp · public numbers, updated daily',!!tt)}${row('Talent profiles','Photos + followers from their handles',Object.keys(profiles).length>2)}${row('SweatPals','Import a tickets CSV on any event',state.tickets.length>0)}${row('Dropbox','Event photo libraries',true)}<div class="row" style="justify-content:flex-start;margin-top:18px"><button class="btn" data-action="exportbackup">Export backup</button><button class="btn" data-action="importbackup">Restore backup</button></div><p class="sub tiny">Export a backup now and then. It's your safety copy.</p></div>`}
function assetCard(a){let src=String(a.source||'').replace(/^Dropbox\s*·\s*/,'').split('/').filter(Boolean),from=src.length?src.slice(-2).join(' / '):'';return `<div class="panel asset-card" data-open="asset:${a.id}"><div class="visual" style="background-image:${photo(a.url)}"></div><h3>${esc(a.name)}</h3>${a.campaign_id?`<div class="sub tiny"><b>Cover for</b> ${esc(campaignName(a.campaign_id))}</div>`:''}${from?`<div class="sub tiny">From ${esc(from)}</div>`:''}</div>`}

document.addEventListener('click',e=>{if(extraClick(e))return;let st=e.target.closest('[data-stage]');if(st){setStage(st.dataset.person,st.dataset.stage);return}let up=e.target.closest('[data-upload]');if(up){uploadInto(up);return}let t=e.target.closest('[data-nav],[data-action],[data-open],[data-tab],[data-view],[data-month],[data-date]');if(!t)return;if(t.dataset.nav){page=t.dataset.nav;selected=null;filter='';render()}else if(t.dataset.action)action(t.dataset.action);else if(t.dataset.open){let [type,...rest]=t.dataset.open.split(':'),key=rest.join(':');if(type==='extpost'){let p=live.posts.find(x=>x.platform+':'+x.post_id===key);if(p?.url)window.open(p.url,'_blank','noopener');return}if(type==='campaign'){selected={type,id:key};filter='';render()}else if(type==='person'){selected={type,id:key};render()}else if(type==='editcampaign'){modal('campaign',state.campaigns.find(x=>x.id===key))}else if(type==='editperson'){modal('person',state.people.find(x=>x.id===key))}else{let kind=type==='ticket'?'ticket':type,rec=state[specs[kind]?.collection]?.find(x=>x.id===key);if(rec)modal(kind,rec)}}else if(t.dataset.tab){filter=t.dataset.tab;render()}else if(t.dataset.view){view=t.dataset.view;render()}else if(t.dataset.month){let [y,m]=month.split('-').map(Number);month=localISO(new Date(y,m-1+Number(t.dataset.month),1)).slice(0,7);render()}else if(t.dataset.date&&!e.target.closest('[data-open]'))modal('content',null,{date:t.dataset.date,campaign_id:filter})});document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){filter=e.target.value;render()}});let dragged='';document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(el){dragged=el.dataset.drag;e.dataTransfer.setData('text/plain',dragged)}});document.addEventListener('dragover',e=>{if(e.target.closest('[data-date]'))e.preventDefault()});document.addEventListener('drop',e=>{let day=e.target.closest('[data-date]');if(day&&dragged){e.preventDefault();let post=state.content.find(x=>x.id===dragged);if(post){post.date=day.dataset.date;save('Rescheduled content',post.title)}dragged=''}});boot();
</script></body></html>

# OTT Studio · trends sync (US TikTok charts, sounds in OTT's scene, city demand).
# Runs Monday and Thursday mornings and on demand.
name: Trends sync
on:
  schedule:
    - cron: '41 13 * * 1,4'   # about 5:41am Pacific, Mon + Thu
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-sync
  cancel-in-progress: false
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull trends through Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/sync-trends.mjs
      - name: Save
        run: |
          git config user.name "OTT Studio bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trends.json
          git diff --cached --quiet || git commit -m "Trends sync $(date -u +%F)"
          git pull --rebase --autostash
          git push
